[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalos"
version = "0.1.0"
description = "Kalos: a domain-neutral Bayesian-optimization platform for sequential experiment design, built on BoTorch. Ships a bioprocess domain (NVIDIA BioNeMo / ESM-2 protein features) and supports mixed continuous/categorical design spaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.2.6",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
# The BoTorch/GPyTorch GP surrogate, optimizer, and grouped-CV evaluation. The
# torch-free `kalos.kit` primitives (splits, drivers, conformal, gates,
# anonymizer) do not need this extra.
# Pinned to uv.lock: the GP numbers depend on the build (BENCHMARK.md). Change
# all three together with kalos/versions.py PINNED_ML (tests/test_torch_pin.py).
ml = ["torch==2.13.0", "botorch==0.18.1", "gpytorch==1.15.2"]
# Optional comparators for `python -m kalos.bench --vs-baselines` (docs/BENCHMARK.md).
# Not needed by the engine. Versions are the ones the committed results were run with.
bench = ["optuna>=5.0,<6", "ax-platform>=1.3.1,<1.4"]
# Real ESM-2 / BioNeMo protein embeddings. The lean KmerEmbedder needs none of this.
protein = ["transformers>=4.40"]
# The web portal (FastAPI viewer over the live engine). The portal drives the
# live GP surrogate, so it needs `ml` too - install as `kalos[ml,portal]`.
portal = ["fastapi>=0.143.0", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1.5", "PyJWT[crypto]>=2.10.1"]
# The LLM tier of `kalos.normalize` (kalos/normalize/llm.py). Pydantic ships
# as a transitive dependency of `anthropic` and is not listed separately.
# The torch-free deterministic core (units/synonyms/plan/apply) and the
# offline fallback in llm.py need none of this.
normalize = ["anthropic>=1.5.0"]
# The grounded assistant (kalos/assist, docs/ASSISTANT.md). BM25 retrieval and
# the .docx export of SOP drafts. Works fully offline; the model that writes
# answers is reached over HTTP (Ollama, local) or the `normalize` extra's SDK.
assist = ["rank-bm25>=0.2.2", "python-docx>=1.1"]
# Optional local embeddings for the assistant's retrieval. Used only when the
# model files are already on disk (never downloaded at run time); without this
# the assistant falls back to BM25.
assist-embed = ["sentence-transformers>=3"]
# `httpx` is the transport `starlette.testclient.TestClient` (used across the
# portal tests) needs. It is not pulled in transitively by fastapi/starlette, so
# a fresh `pip install -e ".[...,dev]"` (what CI does) leaves it absent and every
# portal test errors at import. Pinned below starlette's httpx2 cutover to keep
# the proven, locally-green transport. See CHANGELOG 2026-07-21 (later).
# `anthropic` is here as well as in the `normalize` extra: tests/test_normalize_llm.py
# imports the SDK to build mocked response objects for the live-LLM path. Those
# tests are fully hermetic (no network, no key), but a bare `import anthropic`
# still needs the package present, and CI installs `.[ml,portal,dev]` only - so
# without this the two mocked-live tests error out on a fresh CI checkout. Listing
# it in `dev` keeps that path genuinely covered instead of silently skipped.
dev = [
  "pytest>=9.1.1", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "scipy-stubs",
  "httpx>=0.27,<1", "anthropic>=1.5.0",
]

[tool.setuptools.packages.find]
include = ["kalos*"]

# The portal serves one non-Python asset straight off the package directory:
# `templates/readout.html` (read at import in kalos/portal/scale_routes.py).
# Without this it is left out of the wheel entirely, and `python -m
# kalos.portal` from an installed package dies at import on a missing file.
# Source checkouts never noticed.
[tool.setuptools.package-data]
"kalos.portal" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Floor matches requires-python (ax-platform needs 3.11). Explicit so ruff does not
# infer it, and so a future floor bump is one line here.
target-version = "py311"

[tool.ruff.lint]
# Pin the ruleset explicitly. With no [tool.ruff] section ruff applies whatever
# its current release defaults to, so a ruff upgrade CI never asked for can turn
# the build red on untouched code: 0.16.0 widened the defaults and put 217 new
# findings in kalos/ alone (UP/B/SIM/FURB/PL/RUF/I), which is what broke CI on
# 2026-07-24. Every rule family below is selected on purpose; a ruff upgrade
# changes what is checked only through this file.
# B and I were adopted 2026-10; UP, SIM and RUF were adopted after the existing
# findings were fixed (safe `ruff check --fix` plus reviewed manual edits).
# ruff targets py311 (target-version above), matching requires-python.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF", "S"]
ignore = [
    # B008: FastAPI's Depends()/Query() in defaults is the framework idiom.
    "B008",
    # B905: zip(strict=) is available on the 3.11 floor now; adopt separately.
    "B905",
    # RUF046: int(round(x)) is an explicit coercion to a Python int; round() on
    # numpy/custom scalars is not guaranteed to return int, so the rewrite is unsafe.
    "RUF046",
    # RUF005: `ndarray + [..]` broadcasts element-wise, and the rule cannot tell
    # a list from an array, so its `[*a, b]` rewrite changes meaning for arrays.
    "RUF005",
    # SIM105: the try/except/pass sites carry per-site rationale comments (and
    # BLE001 suppressions) that contextlib.suppress would silently drop.
    "SIM105",
    # RUF100: would strip noqa codes for rules not enabled here (BLE001, S*,
    # SLF001), deleting the comments that record why each exception is deliberate.
    "RUF100",
    # S101: assert here states internal invariants and narrows types for mypy; no
    # request validation relies on it (those paths raise HTTPException/ValueError).
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"examples/**" = ["S"]
"experiments/**" = ["S"]
# __all__ is grouped by source module under a comment per group; sorting it
# would scramble that grouping, and the order has no runtime meaning.
"kalos/kit/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
packages = ["kalos"]
# Third-party libs without usable stubs in this project's context. torch/botorch/
# gpytorch DO ship py.typed, but following their full type surface makes a cold-cache
# run take minutes; we typecheck kalos's own code, not theirs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "botorch.*", "gpytorch.*", "linear_operator.*", "optuna.*", "ax.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
