# kalos reference deployment: engine (FastAPI/uvicorn) + kalos-web (Next.js) +
# a SQLite backup sidecar. Procedures (deploy, keys, onboarding, upgrade,
# rollback, restore) and the security checklist are in RUNBOOK.md.
#
# Topology: ONE front door. The browser talks only to kalos-web. kalos-web
# signs users in (Better Auth, Google OAuth + TOTP, invite-only) and its
# server-side proxy (/api/engine/...) forwards to the engine over the
# compose-internal network. The engine publishes no host port.
#
# Auth between web and engine: for every request the web proxy mints a
# short-lived (60 s) EdDSA JWT naming the user, session, tenant and scopes,
# signed with an Ed25519 private key only the web holds. The engine trusts the
# matching PUBLIC key from a JWKS file (KALOS_JWT_PUBLIC_KEYS_FILE), printed by
# kalos-web's `scripts/engine-jwks.mjs`. The tenant comes from the web's
# tenants map (KALOS_TENANT_MAP_FILE: organization id -> engine tenant). The
# engine never trusts a tenant from the request (docs/ENGINE_TOKEN.md).
# Static bearer tokens (KALOS_AUTH_TOKENS) are OPTIONAL and only for service
# accounts (scripts, CI); kalos-web never sends one.
#
# The engine binds 0.0.0.0 inside its container so the web service can reach
# it. On a non-loopback bind the engine refuses to start unless authentication
# is configured (here: the JWKS) AND KALOS_ANON_SALT is set
# (kalos/portal/config.py `assert_safe_exposure`). A missing or malformed JWKS
# fails closed. Read the refusal with `docker compose logs engine`.
#
# Data: SQLite in the `kalos-state` named volume (engine) and the web's
# auth database in `kalos-web-data`. Backups of the engine databases go to a
# host directory OUTSIDE the volumes, so `docker compose down -v` cannot take
# them. Secrets and per-environment values come from `.env` (see
# .env.example); key files and the tenants map are mounted from host
# directories, never baked into an image.

services:
  engine:
    build:
      context: ..
      dockerfile: deploy/engine/Containerfile
    image: kalos-engine:${KALOS_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # 0.0.0.0, not the image's loopback default: the `web` service reaches
      # the engine over the compose network. No host port is published.
      - KALOS_HOST=0.0.0.0
      - KALOS_PORT=8050
      # REQUIRED. The JWKS (public keys only) that kalos-web's engine tokens
      # are verified against. Generated by kalos-web's scripts/engine-jwks.mjs
      # from the same private key the web signs with (RUNBOOK.md, "Keys").
      # The directory is mounted (not the file) so an atomic rename of a new
      # JWKS is picked up on the next request.
      - KALOS_JWT_PUBLIC_KEYS_FILE=/config/engine-jwks.json
      # Optional; the defaults match what kalos-web mints (iss kalos-web,
      # aud kalos-engine, 120 s maximum TTL, 30 s leeway). Empty = default.
      - KALOS_JWT_ISSUER=${KALOS_JWT_ISSUER:-}
      - KALOS_JWT_AUDIENCE=${KALOS_JWT_AUDIENCE:-}
      - KALOS_JWT_MAX_TTL_S=${KALOS_JWT_MAX_TTL_S:-}
      # Optional: refuse a user (sub:<id>) or one session (sid:<id>) at once.
      - KALOS_AUTH_DENY_SUBJECTS=${KALOS_AUTH_DENY_SUBJECTS:-}
      # OPTIONAL service accounts only (scripts, CI): an inline JSON array of
      # hashed static tokens. kalos-web does not use these. Leave empty unless a
      # non-browser client needs engine access (see .env.example for the shape).
      - KALOS_AUTH_TOKENS=${KALOS_AUTH_TOKENS:-}
      # REQUIRED for a non-loopback bind (assert_safe_exposure). Seeds the
      # identity pseudonyms in anonymized output (kalos/data/anonymizer.py).
      - KALOS_ANON_SALT=${KALOS_ANON_SALT}
      # Optional. The browser never calls the engine in this topology (the web
      # proxies), so the engine's CORS allowlist only matters for the
      # direct-browser dev escape hatch (RUNBOOK.md, "Changing the engine URL").
      - KALOS_CORS_ORIGINS=${KALOS_CORS_ORIGINS:-}
      # State dir: the engine's SQLite databases and caches, on the volume below.
      - KALOS_STATE_DIR=/home/kalos/.kalos
      # Optional external-provider credentials (kalos/providers/). The engine
      # works offline without any of them. Unset and empty mean the same.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      # Sizing knobs, all with working defaults; take effect only if set.
      - KALOS_MAX_UPLOAD_MB=${KALOS_MAX_UPLOAD_MB:-}
      - KALOS_MAX_FIT_ROWS=${KALOS_MAX_FIT_ROWS:-}
      # 0 = do not pin torch's thread count. The bare-metal default (pin 4)
      # measured 47 s vs 600 s+ for the same analysis on this image's
      # linux-aarch64 torch/OpenBLAS build (2026-09-10). The container
      # already bounds CPU.
      - KALOS_TORCH_THREADS=${KALOS_TORCH_THREADS:-0}
    volumes:
      # Named volume: survives container recreation (rebuild, image update).
      - kalos-state:/home/kalos/.kalos
      # The engine's JWKS, read-only. Must contain engine-jwks.json, readable
      # by uid 10001 (RUNBOOK.md, "Keys").
      - ./engine-config:/config:ro
    # No published port. HEALTHCHECK (GET /healthz) is baked into the image;
    # `web` waits for it via depends_on below.

  web:
    build:
      context: ../../kalos-web
      dockerfile: Dockerfile
    image: kalos-web:${KALOS_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Server-side only; never NEXT_PUBLIC_.
      - KALOS_ENGINE_URL=http://engine:8050
      # REQUIRED. The Ed25519 PKCS#8 PEM the proxy signs engine tokens with,
      # and its key id. The engine's JWKS must hold the matching public key
      # under the same kid. Generate both with RUNBOOK.md, "Keys".
      - KALOS_ENGINE_JWT_PRIVATE_KEY_FILE=/run/secrets/engine-jwt-ed25519.pem
      - KALOS_ENGINE_JWT_KID=${KALOS_ENGINE_JWT_KID}
      # Organization id -> engine tenant. Written by kalos-web's
      # scripts/create-org.mjs (RUNBOOK.md, "Onboarding"); re-read on change.
      # Without it every organization gets 403.
      - KALOS_TENANT_MAP_FILE=/config/tenants.json
      # REQUIRED by kalos-web's boot check in production (kalos-web
      # docs/AUTH.md): sessions, Google OAuth, reverse proxy.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - KALOS_PUBLIC_URL=${KALOS_PUBLIC_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES}
      - AUTH_ACCEPT_NO_PROXY=${AUTH_ACCEPT_NO_PROXY:-}
      - AUTH_DB_PATH=/data/auth.db
      # Proxy timeout for engine calls, ms (default 120000). Raise it if a
      # cold analysis takes longer on your hardware.
      - KALOS_ENGINE_TIMEOUT_MS=${KALOS_ENGINE_TIMEOUT_MS:-}
    volumes:
      # Users, sessions, organizations, TOTP (SQLite, uid 10001).
      - kalos-web-data:/data
      # The tenants map, read-only for the server. Onboarding writes it with a
      # one-shot container that mounts this directory read-write.
      - ./web-config:/config:ro
      # The engine-token signing key, read-only, readable by uid 10001.
      - ./secrets/engine-jwt-ed25519.pem:/run/secrets/engine-jwt-ed25519.pem:ro
    depends_on:
      engine:
        condition: service_healthy
    # Published on loopback by default. kalos-web requires sign-in, but serve it
    # to other machines only through a TLS-terminating reverse proxy listed in
    # AUTH_TRUSTED_PROXIES; then set KALOS_WEB_BIND to the interface it uses.
    ports:
      - "${KALOS_WEB_BIND:-127.0.0.1}:${KALOS_WEB_PORT:-3000}:3000"

  backup:
    build:
      context: ./backup
      dockerfile: Containerfile
    image: kalos-backup:${KALOS_IMAGE_TAG:-local}
    restart: always
    environment:
      - KALOS_STATE_DIR=/home/kalos/.kalos
      - BACKUP_DIR=/backups
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      # Read-only: the sidecar only reads the live databases via
      # `sqlite3 .backup` (backup/backup.sh).
      - kalos-state:/home/kalos/.kalos:ro
      # Host-mounted, outside the compose volumes, so backups survive
      # `docker compose down -v`. Must exist and be writable by uid 10001
      # before `docker compose up` (RUNBOOK.md, "Deploy").
      - ./backups:/backups
    depends_on:
      - engine

volumes:
  kalos-state:
  kalos-web-data:
