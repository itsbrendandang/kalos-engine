name: CI

# Runs the checks the README documents under "Local development": ruff, mypy,
# and pytest, on the Python floor the project requires. The GP-heavy tests are
# marked `slow`; every push runs the fast set for quick feedback, and the full
# suite runs on main and on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: ruff
        run: uv run ruff check kalos/ tests/ examples/
      - name: mypy
        run: uv run mypy

  tests:
    name: pytest (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (skip the GP-heavy 'slow' tests)
        run: uv run python -m pytest -q -m "not slow"

  tests-full:
    name: pytest (full, incl. slow)
    # The whole suite (GP fits + pool replays) is slow on a runner, so it does
    # not gate every push. It runs on main and on demand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (full suite)
        run: uv run python -m pytest -q
