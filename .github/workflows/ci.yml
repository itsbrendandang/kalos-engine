name: CI

# Runs exactly the checks the README documents under "Local development":
# ruff, mypy, and the pytest suite, on the Python floor the project requires.
# Kept honest: if this changes, the README's "the same as CI" line must too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: ruff
        run: uv run ruff check kalos/ tests/ examples/
      - name: mypy
        run: uv run mypy

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest
        run: uv run python -m pytest -q
