name: CI

# The checks the README documents under "Local development": ruff, mypy, pytest.
# The suite is CPU-bound GP fits, so pytest runs in parallel (pytest-xdist, -n
# auto). GP-heavy tests are marked `slow`: every push runs the fast set, and the
# full suite runs on main and on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: ruff
        run: uv run ruff check kalos/ tests/ examples/
      - name: mypy
        run: uv run mypy

  tests:
    name: pytest (fast)
    runs-on: ubuntu-latest
    # The suite is CPU-bound GP fits and GitHub runners are small (2-4 cores), so
    # even parallel + slow-excluded it needs more than 20 min. 35 gives headroom.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (fast, parallel, skip GP-heavy 'slow' tests)
        run: uv run python -m pytest -q -m "not slow" -n auto

  tests-full:
    name: pytest (full, incl. slow)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (full suite, parallel)
        run: uv run python -m pytest -q -n auto
