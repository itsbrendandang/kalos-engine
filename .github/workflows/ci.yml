name: CI

# The checks the README documents under "Local development": ruff, mypy, pytest.
# The suite is CPU-bound GP fits, so pytest runs in parallel (pytest-xdist, -n
# auto). GP-heavy tests are marked `slow`: every push runs the fast set, and the
# full suite runs on main and on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin BLAS/OpenMP to one thread everywhere. The suite has determinism tests that
# compare analysis outputs for exact equality; under parallel xdist, a varying
# per-worker BLAS thread count perturbs GP fits at the last float digit and makes
# those comparisons flaky. One thread per process keeps them reproducible (and,
# with many xdist workers, is also faster - no oversubscription).
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  lint-type:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: ruff
        run: uv run ruff check kalos/ tests/ examples/
      - name: mypy
        run: uv run mypy

  tests:
    name: pytest (fast)
    runs-on: ubuntu-latest
    # The fast suite (slow tests excluded) is still ~35 min of CPU-bound GP fits
    # on a small runner, so it is SHARDED across parallel jobs: each shard runs a
    # disjoint ~half via xdist's loadgroup, so wall time stays well under the cap
    # even as the suite grows. Shards must agree, so the branch is green only when
    # both pass.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (fast shard ${{ matrix.shard }}/2, parallel, skip slow + serial)
        run: >
          uv run python -m pytest -q -m "not slow and not serial" -n auto
          --splits 2 --group ${{ matrix.shard }}

  tests-serial:
    name: pytest (serial determinism)
    # Determinism tests compare analysis output for exact equality and must NOT
    # run under parallel xdist (float results vary per worker even with threads
    # pinned). A handful of tests, so a quick serial job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (serial, no xdist)
        run: uv run python -m pytest -q -m "serial"

  tests-full:
    name: pytest (full, incl. slow)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create a 3.11 venv and install (ml, portal, bench, dev)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[ml,portal,bench,dev]"
      - name: pytest (everything except serial, parallel)
        run: uv run python -m pytest -q -m "not serial" -n auto
      - name: pytest (serial determinism, no xdist)
        run: uv run python -m pytest -q -m "serial"
