<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scale-Up Readout</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 32px;
    background: #ffffff;
    color: #1a1f2b;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 11px;
    line-height: 1.3;
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #5a6472; margin: 10px 0 4px; border-bottom: 1px solid #dde2e8; padding-bottom: 2px; }
  .subtitle { color: #5a6472; margin: 0 0 2px; font-size: 10px; }
  .timestamp { color: #8a9099; margin: 0 0 8px; font-size: 9px; }
  .banner { padding: 7px 12px; border-radius: 4px; margin-bottom: 8px; }
  .banner-headline { font-weight: 700; font-size: 13px; }
  .banner-machine { font-size: 8px; letter-spacing: 0.03em; opacity: 0.7; margin-left: 6px; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .banner-number { background: #e5f4ea; color: #1e6b3a; border: 1px solid #b6ddc4; }
  .banner-warning { background: #fdf3dc; color: #8a5a00; border: 1px solid #ecd39a; }
  .banner-refusal { background: #fbe9e9; color: #a02020; border: 1px solid #eec2c2; }
  .unused-note { margin: 4px 0 0; font-size: 9px; color: #555; }
  .note-info { padding: 5px 12px; border-radius: 4px; margin-bottom: 8px; background: #eaf1f8; color: #1f3a52; border: 1px solid #c7d9e8; font-size: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 16px; margin-bottom: 3px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #e3e6ea; padding: 1px 0; }
  .kv .k { color: #5a6472; }
  .kv .v { font-weight: 600; text-align: right; }
  .kv-hash .v { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 7.5px; letter-spacing: -0.1px; white-space: nowrap; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 3px; }
  table th, table td { text-align: left; padding: 2px 5px; border-bottom: 1px solid #e9ecef; font-size: 10px; }
  table th { background: #f4f6f8; color: #444; font-weight: 600; }
  .const-table td { padding: 2px 6px; font-size: 9px; border-bottom: 1px solid #f0f2f4; }
  .const-table td.name { color: #5a6472; }
  .const-table td.value { font-weight: 600; text-align: right; }
  .reasons { margin: 3px 0 0; padding-left: 16px; }
  .reasons li { margin-bottom: 1px; }
  .skipped-reasons { margin: 3px 0 0; padding-left: 16px; }
  .skipped-reasons li { margin-bottom: 1px; }
  .data-plan { margin: 3px 0 0; padding-left: 16px; }
  .data-plan li { margin-bottom: 1px; }
  .muted { color: #5a6472; }
  .provenance { margin: 0; }
  .intended-use { margin-top: 10px; padding-top: 6px; border-top: 1px solid #dde2e8; font-size: 9px; color: #5a6472; font-style: italic; }
  .appendix { break-before: page; page-break-before: always; margin-top: 0; }
  .appendix h2 { margin-top: 0; }
  .plan-json { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 8px; white-space: pre-wrap; word-break: break-all; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 3px; padding: 6px; }
  @media print {
    /* `@page`'s margin below already reserves the page border - printing
       the screen padding ON TOP of it would double-count the margin and
       push content onto a second page for no reason. */
    body { padding: 0; }
  }
  @page {
    size: Letter;
    margin: 0.4in;
  }
</style>
</head>
<body>
<h1>Scale-Up Readout</h1>
<p class="subtitle">Kalos ScaleBridge - development decision support</p>
<p class="timestamp">Generated ${generated_at} UTC</p>
${body}
</body>
</html>
